[package]
name = "taurscribe"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "taurscribe"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Benchmark / eval tools live in tools/ (not src/bin, which Tauri would bundle).
# They need `--features dev-tools`, so `cargo build --release` (and the app bundle) only produce the app itself.
[features]
dev-tools = []

[[bin]]
name = "audio_pipeline_bench"
path = "tools/audio_pipeline_bench.rs"
required-features = ["dev-tools"]

[[bin]]
name = "custom_vocab_eval"
path = "tools/custom_vocab_eval.rs"
required-features = ["dev-tools"]

[[bin]]
name = "librispeech_eval"
path = "tools/librispeech_eval.rs"
required-features = ["dev-tools"]

[[bin]]
name = "flowscribe_compare"
path = "tools/flowscribe_compare.rs"
required-features = ["dev-tools"]

[[bin]]
name = "librispeech_manifest"
path = "tools/librispeech_manifest.rs"
required-features = ["dev-tools"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "taurscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"                                           # Prevent multiple instances
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.15"
crossbeam-channel = "0.5"
hound = "3.5"
chrono = "0.4"
# whisper-rs with CUDA + Vulkan (includes 12x iGPU performance boost from whisper.cpp v1.8.3)
# Update periodically: cargo update -p whisper-rs
# NOTE: Disabled CUDA/Vulkan for now - enable if you have CUDA Toolkit and Vulkan SDK installed
# --- General Dependencies (Required on ALL platforms) ---
rubato = "0.14"
half = "2"
dirs = "6.0.0"
rdev = { git = "https://github.com/rustdesk-org/rdev.git" }
regex = "1.12.2"
tauri-plugin-store = "2.4.2"
enigo = "0.6.1"
arboard = { version = "3", features = ["image-data"] }
sysinfo = "0.32"
libc = "0.2"
# llama-cpp-2: llama.cpp bindings for Rust (replaces Candle)
# dynamic-link builds ggml/llama as shared libs (DLLs) to avoid LNK2005
# diamond-dependency with whisper-rs which also statically links ggml.
# Use crates.io so CI can build without private repo access.
# PINNED: v0.1.137 sys crate has a broken CMake install step on Windows.
# Pin both the wrapper AND sys crate to the last known working version.
llama-cpp-2 = { version = "=0.1.157", default-features = false, features = [
    "dynamic-link",
] }
llama-cpp-sys-2 = "=0.1.157"
encoding_rs = "0.8"
anyhow = "1.0"
ndarray = "0.17"
# FFT for the speaker-embedding fbank front-end
rustfft = "6.2"
# Random ids for speaker profiles and meetings
rand = "0.9"


# RNNoise noise suppression (pure Rust, no C deps, CPU-only, cross-platform)
nnnoiseless = "0.5"

# File system watcher - Detect model changes
notify = "6.1"

# Audio file decoding for drag-and-drop file transcription (pure Rust, no binary deps)
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "ogg", "wav", "isomp4"] }

# --- Platform-Specific AI Backends ---


# 1. Base / CPU Fallback (ARM Windows/Linux)
# -------------------------------------------------------------------------
whisper-rs = { git = "https://codeberg.org/tazz4843/whisper-rs.git" }
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "half",
    "copy-dylibs",
] }
# Downloader & Verification
futures-util = "0.3.31"
reqwest = { version = "0.13.1", default-features = false, features = [
    "native-tls",
    "http2",
    "stream",
    "json",
    "multipart",
] }
sha2 = "0.10.9"
hex = "0.4.3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "rt", "sync", "macros", "time", "io-util"] }
opus = "0.3"
# transcribe.cpp: GGUF speech models (Granite Speech 5, Qwen3-ASR, Nemotron-3
# Diarization) on CPU, Metal, Vulkan, CUDA and ROCm. Pinned to the Glimpse fork:
# upstream main at ed3468f plus Nemotron-3 Diarization, which upstream lacks.
transcribe-cpp = { git = "https://github.com/LegendarySpy/transcribe.cpp", rev = "b893ed29480ea6392fb9859e64aaefaaa475230b", default-features = false }
tauri-plugin-autostart = "2"


# 2. macOS Configuration
# -------------------------------------------------------------------------

# Common macOS dependencies (ARM & Intel)
# -------------------------------------------------------------------------
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { git = "https://codeberg.org/tazz4843/whisper-rs.git", features = [
    "coreml",
] }
# llama-cpp-2: Uses Metal automatically on macOS (no special feature needed)
llama-cpp-2 = { version = "=0.1.157", default-features = false, features = [
    "dynamic-link",
] }
llama-cpp-sys-2 = "=0.1.157"
# macOS Accessibility API for native text insertion (kAXSelectedTextAttribute)
accessibility-sys = "0.1"
core-foundation = "0.9"
# CGEvent-based key simulation (thread-safe, unlike enigo's TSM calls)
core-graphics = "0.23"
# objc2: safe Rust bindings to Objective-C + AppKit for NSWindow level/behavior
# Required to pierce fullscreen spaces (kCGScreenSaverWindowLevel + canJoinAllSpaces)
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWindow",
    "NSPanel",
    "NSView",
    "NSTextField",
    "NSControl",
    "NSText",
    "NSColor",
    "NSFont",
    "NSScreen",
] }
objc2-foundation = "0.3"
meeting-record = "0.1"

# 2b. Apple Silicon Specific (M1/M2/M3/M4)
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# MLX: Nemotron-3 Diarization runs faster than its GGUF on Metal (see SUPPORT_MATRIX §5).
# mlx-sys always links MLX's gguflib, whose gguf_* C symbols collide with ggml's
# (transcribe.cpp). The linker keeps ggml's copy (verified with `nm`: neighbours are
# ggml's gguf_find_key/gguf_kv), which is the one Granite/Qwen3 need. Never load a
# .gguf through MLX: it would call ggml's functions with MLX's argument types.
mlx-rs = "0.32.0"
transcribe-cpp = { git = "https://github.com/LegendarySpy/transcribe.cpp", rev = "b893ed29480ea6392fb9859e64aaefaaa475230b", default-features = false, features = ["metal"] }
ort = { version = "2.0.0-rc.12", features = [
    "download-binaries",
    "coreml",
    "xnnpack",
    "api-24",
] }

# 2c. Intel x86_64 Mac Specific (Core i5/i7/i9)
# Uses dynamic loading with api-20 compatible with official macOS x86_64 ONNX Runtime builds.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "load-dynamic",
    "api-20",
] }
[target.'cfg(windows)'.dependencies]
meeting-record = "0.1"
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# 3. Windows (x86_64) -> CUDA + DirectML + TensorRT
# CUDA: NVIDIA GPU acceleration (primary)
# DirectML: Universal Windows GPU acceleration (AMD/Intel fallback)
# TensorRT: NVIDIA optimized inference
# WebGPU: Cross-platform GPU (additional fallback)
# XNNPACK: CPU optimization
# -------------------------------------------------------------------------
[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { git = "https://github.com/LegendarySpy/transcribe.cpp", rev = "b893ed29480ea6392fb9859e64aaefaaa475230b", default-features = false, features = ["cuda", "vulkan"] }
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# vulkan temporarily removed for Windows build
whisper-rs = { git = "https://codeberg.org/tazz4843/whisper-rs.git", features = [
    "cuda",
] }
ort = { version = "2.0.0-rc.12", features = [
    "download-binaries",
    "cuda",
    "directml",
    "tensorrt",
    "xnnpack",
    "half",
] }
# llama-cpp-2 with dynamic-link (CPU-only LLM on Windows to avoid CUDA build issues)
llama-cpp-2 = { version = "=0.1.157", default-features = false, features = [
    "dynamic-link",
] }
llama-cpp-sys-2 = "=0.1.157"
# 3b. Linux (x86_64) — CPU / GPU build
# -------------------------------------------------------------------------
# DEFAULT: CPU-only. Works on any Linux machine (AMD, Intel, NVIDIA without CUDA).
# FOR GPU BUILD: uncomment the cuda/vulkan/tensorrt features below.
#
# Prerequisites for GPU build:
#   - CUDA Toolkit 12.x:  https://developer.nvidia.com/cuda-downloads
#   - Vulkan SDK:         sudo apt install vulkan-tools libvulkan-dev
#   Then: export CARGO_FEATURES="cuda" before running tauri build
# -------------------------------------------------------------------------
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { git = "https://github.com/LegendarySpy/transcribe.cpp", rev = "b893ed29480ea6392fb9859e64aaefaaa475230b", default-features = false, features = ["cuda", "vulkan"] }

whisper-rs = { git = "https://codeberg.org/tazz4843/whisper-rs.git", features = [
    "cuda",
    "vulkan",
] }


ort = { version = "2.0.0-rc.12", features = [
    "download-binaries",
    "cuda",
    "tensorrt",
    "xnnpack",
    "half",
] }

llama-cpp-2 = { version = "=0.1.157", default-features = false, features = [
    "dynamic-link",
    "cuda",
] }

llama-cpp-sys-2 = "=0.1.157"
# 4. Windows (ARM64) -> DirectML + XNNPACK# DirectML: Hardware-accelerated on Qualcomm Snapdragon X ARM processors
# XNNPACK: Cross-platform CPU optimization
# -------------------------------------------------------------------------
[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
ort = { version = "2.0.0-rc.12", features = [
    "download-binaries",
    "directml",
    "xnnpack",
    "half",
] }

# 5. Linux (ARM64) -> XNNPACK
# XNNPACK: CPU optimization for ARM processors (Raspberry Pi, etc.)
# -------------------------------------------------------------------------
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
whisper-rs = { git = "https://codeberg.org/tazz4843/whisper-rs.git" }
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "xnnpack", "half"] }

[dev-dependencies]

# Speed up dev builds by optimizing dependencies but not your code
[profile.dev]
opt-level = 0 # Don't optimize your code (fast builds)

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# If you want even faster dev builds, uncomment this (but slower runtime):
# [profile.dev.package."*"]
# opt-level = 0
