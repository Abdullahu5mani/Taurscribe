name: Sequential Linux and Windows feature tests

on:
  push:
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vm-feature-tests.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vm-feature-tests.yml'
  workflow_dispatch:

concurrency:
  group: vm-feature-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64 VM — feature and library tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI: 'true'
      CMAKE_GENERATOR: Ninja
      CMAKE_CUDA_ARCHITECTURES: '75;86;89'
      TRANSCRIBE_CMAKE_ARGS: '-DCMAKE_POSITION_INDEPENDENT_CODE=ON'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Tauri, audio, and native build dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake ninja-build pkg-config libclang-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev libasound2-dev libpipewire-0.3-dev libssl-dev \
            libvulkan-dev patchelf
      - name: Install CUDA toolkit
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y cuda-toolkit-12-6
          sudo ln -sf /usr/local/cuda-12.6/lib64/stubs/libcuda.so /usr/lib/x86_64-linux-gnu/libcuda.so
          sudo ln -sf /usr/local/cuda-12.6/lib64/stubs/libcuda.so /usr/lib/x86_64-linux-gnu/libcuda.so.1
          echo 'CUDA_PATH=/usr/local/cuda-12.6' >> "$GITHUB_ENV"
          echo '/usr/local/cuda-12.6/bin' >> "$GITHUB_PATH"
          echo 'LIBRARY_PATH=/usr/local/cuda-12.6/lib64/stubs:/usr/local/cuda-12.6/lib64' >> "$GITHUB_ENV"
          echo 'LD_LIBRARY_PATH=/usr/local/cuda-12.6/lib64:/usr/local/cuda-12.6/lib64/stubs' >> "$GITHUB_ENV"
      - uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Configure Vulkan and linker paths
        run: |
          echo "LD_LIBRARY_PATH=${VULKAN_SDK}/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${VULKAN_SDK}/lib:${LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L ${VULKAN_SDK}/lib -L /usr/local/cuda-12.6/lib64/stubs -C link-arg=-Wl,--allow-multiple-definition" >> "$GITHUB_ENV"
          glslc --version
          nvcc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Remove host-specific Cargo configuration
        run: |
          sed -i.bak '/\[target\.x86_64-pc-windows-msvc\]/,/^$/d' src-tauri/.cargo/config.toml
          sed -i.bak '/\[target\.x86_64-pc-windows-gnu\]/,/^$/d' src-tauri/.cargo/config.toml
          sed -i.bak '/^CFLAGS = "-MD"/d; /^CXXFLAGS = "-MD"/d; /^CL = "-MD"/d' src-tauri/.cargo/config.toml
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Run app behavior tests serially on Linux
        working-directory: src-tauri
        run: cargo test --lib -- --test-threads=1

  windows:
    name: Windows x64 VM — feature and library tests
    needs: linux
    if: ${{ always() }}
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CI: 'true'
      CARGO_TARGET_DIR: 'C:\bld'
      CMAKE_GENERATOR: Ninja
      CMAKE_CUDA_ARCHITECTURES: '75;86;89'
      CMAKE_DISABLE_FIND_PACKAGE_Ccache: 'TRUE'
      RUST_BACKTRACE: '1'
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install CUDA toolkit
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.9.1'
          method: network
          use-github-cache: false
          use-local-cache: false
      - uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Install SPIRV headers
        shell: bash
        run: |
          src="$(cygpath -m "$RUNNER_TEMP")/SPIRV-Headers"
          prefix="$(cygpath -m "$RUNNER_TEMP")/spirv-headers"
          git clone --depth 1 --branch vulkan-sdk-1.4.309.0 https://github.com/KhronosGroup/SPIRV-Headers.git "$src"
          cmake -S "$src" -B "$src/build" -DSPIRV_HEADERS_ENABLE_TESTS=OFF
          cmake --install "$src/build" --prefix "$prefix"
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
      - name: Install LLVM, Ninja, and NASM
        shell: pwsh
        run: |
          choco install llvm ninja -y
          $version = '2.16.03'
          $installer = Join-Path $env:RUNNER_TEMP 'nasm-setup.exe'
          Invoke-WebRequest "https://www.nasm.us/pub/nasm/releasebuilds/$version/win64/nasm-$version-installer-x64.exe" -OutFile $installer
          Start-Process $installer -ArgumentList '/S' -Wait
          'C:\Program Files\NASM' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Remove developer machine library path
        shell: pwsh
        run: |
          $config = 'src-tauri/.cargo/config.toml'
          (Get-Content $config) | Where-Object { $_ -notmatch 'C:/Users/abdul/OneDrive/Desktop/Taurscribe' -and $_ -notmatch '^WHISPER_LIB_DIR' } | Set-Content $config
      - name: Create MSVC libm compatibility archive
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'taurscribe-msvc-compat'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content (Join-Path $dir 'empty.c') '/* empty libm compatibility archive */'
          cl.exe /nologo /c (Join-Path $dir 'empty.c') /Fo"$dir\empty.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          lib.exe /nologo /out:"$dir\m.lib" /machine:X64 "$dir\empty.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LIB=$dir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run app behavior tests serially on Windows
        working-directory: src-tauri
        shell: pwsh
        env:
          CUDA_PATH: ${{ steps.cuda.outputs.CUDA_PATH }}
        run: |
          $env:PATH = "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\debug;$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\debug\deps;$env:PATH"
          cargo test --lib --target x86_64-pc-windows-msvc -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
