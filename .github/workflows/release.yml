name: Release

# Trigger when a version tag is pushed (e.g. git tag v0.1.0 && git push --tags)
on:
  push:
    tags: ['v*']
    # Build + smoke-test every GPU flavor without publishing anything.
    branches: ['gpu-smoke/**']
  workflow_dispatch:

# Cancel in-progress runs for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build all platforms ───────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        # flavor = the GPU build (see src-tauri/src/gpu.rs); features = its Cargo feature.
        # Each GPU vendor gets its own installer built on that vendor's native stack.
        include:
          - platform: 'macos-latest'
            name: 'macOS (Apple Silicon)'
            target: 'aarch64-apple-darwin'
            flavor: 'apple'
            features: ''
            os_name: 'macOS'
            arch: 'ARM64'

          - platform: 'macos-latest'
            name: 'macOS (Intel x86_64)'
            target: 'x86_64-apple-darwin'
            flavor: 'apple'
            features: ''
            os_name: 'macOS'
            arch: 'x86_64'

          - platform: 'windows-2022'
            name: 'Windows (x86_64)'
            target: 'x86_64-pc-windows-msvc'
            flavor: 'cpu'
            features: ''
            os_name: 'Windows'
            arch: 'x86_64'

          - platform: 'windows-2022'
            name: 'Windows (x86_64, NVIDIA CUDA)'
            target: 'x86_64-pc-windows-msvc'
            flavor: 'nvidia'
            features: 'gpu-nvidia'
            os_name: 'Windows'
            arch: 'x86_64'

          - platform: 'windows-2022'
            name: 'Windows (x86_64, Vulkan: AMD / Intel)'
            target: 'x86_64-pc-windows-msvc'
            flavor: 'vulkan'
            features: 'gpu-vulkan'
            os_name: 'Windows'
            arch: 'x86_64'

          - platform: 'windows-latest'
            name: 'Windows (ARM64)'
            target: 'aarch64-pc-windows-msvc'
            flavor: 'cpu'
            features: ''
            os_name: 'Windows'
            arch: 'ARM64'

          - platform: 'windows-latest'
            name: 'Windows (ARM64, Snapdragon Adreno)'
            target: 'aarch64-pc-windows-msvc'
            flavor: 'adreno'
            features: 'gpu-adreno'
            os_name: 'Windows'
            arch: 'ARM64'

          - platform: 'ubuntu-24.04'
            name: 'Linux (x86_64, NVIDIA CUDA)'
            target: 'x86_64-unknown-linux-gnu'
            flavor: 'nvidia'
            features: 'gpu-nvidia'
            os_name: 'Linux'
            arch: 'x86_64'

          - platform: 'ubuntu-24.04'
            name: 'Linux (x86_64, AMD ROCm)'
            target: 'x86_64-unknown-linux-gnu'
            flavor: 'amd'
            features: 'gpu-amd'
            os_name: 'Linux'
            arch: 'x86_64'

          - platform: 'ubuntu-24.04'
            name: 'Linux (x86_64, Vulkan: Intel / other)'
            target: 'x86_64-unknown-linux-gnu'
            flavor: 'vulkan'
            features: 'gpu-vulkan'
            os_name: 'Linux'
            arch: 'x86_64'

    runs-on: ${{ matrix.platform }}
    name: Build - ${{ matrix.name }}

    steps:
      - name: Enable long paths for Git
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      # ── CUDA Setup ──
      - name: Install CUDA Toolkit & Configure Stubs (Linux)
        if: contains(matrix.platform, 'ubuntu') && matrix.flavor == 'nvidia'
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC apt-get -y install cuda-toolkit-12-9

          # Dynamically discover installed CUDA directory
          CUDA_DIR=$(find /usr/local -maxdepth 1 -type d -name "cuda*" | sort -V | tail -n 1)
          if [ -z "$CUDA_DIR" ] || [ ! -d "$CUDA_DIR" ]; then
            CUDA_DIR="/usr/local/cuda-12.9"
          fi
          echo "Discovered CUDA at: $CUDA_DIR"

          # Configure driver stub for build-time linking on headless runner
          STUB_DIR="$CUDA_DIR/lib64/stubs"
          if [ -d "$STUB_DIR" ]; then
            if [ -f "$STUB_DIR/libcuda.so" ] && [ ! -e "$STUB_DIR/libcuda.so.1" ]; then
              sudo ln -sf libcuda.so "$STUB_DIR/libcuda.so.1"
            fi
            sudo ln -sf "$STUB_DIR/libcuda.so" /usr/lib/x86_64-linux-gnu/libcuda.so
            sudo ln -sf "$STUB_DIR/libcuda.so" /usr/lib/x86_64-linux-gnu/libcuda.so.1
          fi

          echo "CUDA_PATH=$CUDA_DIR" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$STUB_DIR:$CUDA_DIR/lib64:${LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$CUDA_DIR/lib64:$STUB_DIR:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "PATH=$CUDA_DIR/bin:$PATH" >> $GITHUB_ENV

      - name: Install CUDA Toolkit (Windows)
        if: contains(matrix.platform, 'windows') && matrix.flavor == 'nvidia'
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: '12.9.1'
          method: 'network'
          use-github-cache: false
          use-local-cache: false

      - name: Show CUDA Info
        if: matrix.flavor == 'nvidia'
        run: |
          nvcc --version
          echo "CUDA_PATH=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"

      # ── AMD ROCm (Linux AMD flavor) ──
      # HIP compiler + hipBLAS/rocBLAS dev packages only (the full SDK won't fit on
      # a hosted runner). Users need ROCm 6.x installed; the .deb depends on it.
      - name: Install ROCm (Linux)
        if: contains(matrix.platform, 'ubuntu') && matrix.flavor == 'amd'
        run: |
          sudo mkdir -p --mode=0755 /etc/apt/keyrings
          wget -qO- https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.4 noble main" | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            hipcc hip-dev rocm-llvm rocm-device-libs rocm-cmake hipblas-dev rocblas-dev
          echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "HIP_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "/opt/rocm/bin" >> $GITHUB_PATH
          # RDNA2 / RDNA3 / RDNA4 consumer cards, plus CDNA2/3 workstation parts.
          echo "AMDGPU_TARGETS=gfx1030;gfx1100;gfx1101;gfx1102;gfx1200;gfx1201;gfx90a;gfx942" >> $GITHUB_ENV
          echo "GPU_TARGETS=gfx1030;gfx1100;gfx1101;gfx1102;gfx1200;gfx1201;gfx90a;gfx942" >> $GITHUB_ENV

      # ── OpenCL SDK (Windows ARM64 Snapdragon flavor) ──
      # llama.cpp's Adreno backend needs OpenCL headers and an ICD loader import
      # library at build time; OpenCL.dll itself comes with Qualcomm's driver.
      - name: Build OpenCL headers and ICD loader (Windows ARM64)
        if: matrix.flavor == 'adreno'
        shell: bash
        run: |
          prefix="$(cygpath -m "$RUNNER_TEMP")/opencl"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git "$RUNNER_TEMP/OpenCL-Headers"
          cmake -S "$RUNNER_TEMP/OpenCL-Headers" -B "$RUNNER_TEMP/OpenCL-Headers/build" -A ARM64 -DBUILD_TESTING=OFF
          cmake --install "$RUNNER_TEMP/OpenCL-Headers/build" --prefix "$prefix"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader.git "$RUNNER_TEMP/OpenCL-ICD-Loader"
          cmake -S "$RUNNER_TEMP/OpenCL-ICD-Loader" -B "$RUNNER_TEMP/OpenCL-ICD-Loader/build" -A ARM64 \
            -DCMAKE_PREFIX_PATH="$prefix" -DBUILD_TESTING=OFF -DOPENCL_ICD_LOADER_BUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/OpenCL-ICD-Loader/build" --config Release
          cmake --install "$RUNNER_TEMP/OpenCL-ICD-Loader/build" --prefix "$prefix" --config Release
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
          echo "OpenCL_ROOT=$prefix" >> "$GITHUB_ENV"

      # ── System Dependencies ──
      - name: Install Xcode Command Line Tools
        if: contains(matrix.platform, 'macos')
        run: xcode-select --install || true

      - name: Install macOS build dependencies
        if: contains(matrix.platform, 'macos')
        run: brew install cmake dylibbundler

      - name: Install Linux System Dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libpipewire-0.3-dev \
            build-essential \
            curl wget file \
            libssl-dev \
            libgtk-3-dev \
            cmake \
            ninja-build \
            mold \
            sccache \
            ccache \
            libvulkan-dev \
            pkg-config \
            libfuse2t64 \
            desktop-file-utils

      - name: Cache ccache (Linux)
        if: contains(matrix.platform, 'ubuntu')
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: linux-ccache-v2-${{ matrix.flavor }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            linux-ccache-v2-${{ matrix.flavor }}-

      - name: Install Vulkan SDK (Linux)
        if: contains(matrix.platform, 'ubuntu')
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Export Vulkan Library Path (Linux)
        if: contains(matrix.platform, 'ubuntu')
        run: |
          echo "LD_LIBRARY_PATH=${VULKAN_SDK}/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "LIBRARY_PATH=${VULKAN_SDK}/lib:${LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Linux — parallelism and ccache dir
        if: contains(matrix.platform, 'ubuntu')
        run: |
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> $GITHUB_ENV
          echo "CCACHE_DIR=${HOME}/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=800M" >> $GITHUB_ENV

      - name: Install Vulkan SDK (Windows)
        if: contains(matrix.platform, 'windows') && matrix.flavor == 'vulkan'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # transcribe.cpp's Vulkan backend needs SPIRV-Headers (CMake package), which the
      # minimal Vulkan SDK install above doesn't include. Same version as the SDK.
      - name: Install SPIRV-Headers (Windows)
        if: contains(matrix.platform, 'windows') && matrix.flavor == 'vulkan'
        shell: bash
        run: |
          src="$(cygpath -m "$RUNNER_TEMP")/SPIRV-Headers"
          prefix="$(cygpath -m "$RUNNER_TEMP")/spirv-headers"
          git clone --depth 1 --branch vulkan-sdk-1.4.309.0 https://github.com/KhronosGroup/SPIRV-Headers.git "$src"
          cmake -S "$src" -B "$src/build" -DSPIRV_HEADERS_ENABLE_TESTS=OFF
          cmake --install "$src/build" --prefix "$prefix"
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"

      - name: Install Windows Build Dependencies
        if: contains(matrix.platform, 'windows')
        shell: pwsh
        run: |
          choco install llvm ninja -y
          # Install NASM directly — Chocolatey CDN is unreliable in CI (frequent 499s)
          $nasmVer = "2.16.03"
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/$nasmVer/win64/nasm-$nasmVer-installer-x64.exe"
          $out = "$env:TEMP\nasm-setup.exe"
          Invoke-WebRequest $url -OutFile $out -UseBasicParsing
          Start-Process $out -ArgumentList "/S" -Wait
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Remove Git's link.exe (Windows)
        if: contains(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $gitLink = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $gitLink) {
            echo "Removing conflicting linker: $gitLink"
            Remove-Item -Force $gitLink
          }

      - name: Configure Clang for ARM64 (Windows)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: |
           echo "CC=clang-cl" >> $env:GITHUB_ENV
           echo "CXX=clang-cl" >> $env:GITHUB_ENV
           echo "CXXFLAGS=-EHsc" >> $env:GITHUB_ENV
           echo "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV

      # ── Rust Setup ──
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # Bumped when native build flags change (whisper-rs doesn't rerun on them).
          prefix-key: 'v2-nvcuda-delayload'
          key: ${{ matrix.flavor }}

      - uses: mozilla-actions/sccache-action@v0.0.9
        if: contains(matrix.platform, 'ubuntu')

      - name: Clean local paths from cargo config (Windows)
        if: runner.os == 'Windows'
        run: |
          $workspace = '${{ github.workspace }}' -replace '\\', '/'
          (Get-Content src-tauri/.cargo/config.toml) -replace 'C:/Users/abdul/OneDrive/Desktop/Taurscribe', $workspace | Set-Content src-tauri/.cargo/config.toml
          (Get-Content src-tauri/.cargo/config.toml) | Where-Object { $_ -notmatch 'WHISPER_LIB_DIR' } | Set-Content src-tauri/.cargo/config.toml

      - name: Clean Windows-specific paths from cargo config on Unix
        if: runner.os != 'Windows'
        run: |
          sed -i.bak '/\[target\.x86_64-pc-windows-msvc\]/,/^$/d' src-tauri/.cargo/config.toml || true
          sed -i.bak '/\[target\.x86_64-pc-windows-gnu\]/,/^$/d' src-tauri/.cargo/config.toml || true
          sed -i.bak '/WHISPER_LIB_DIR/d' src-tauri/.cargo/config.toml || true
          sed -i.bak '/VULKAN_SDK.*VulkanSDK/d' src-tauri/.cargo/config.toml || true
          sed -i.bak '/LIBCLANG_PATH.*Microsoft/d' src-tauri/.cargo/config.toml || true
          sed -i.bak '/target-dir.*C:\/bld/d' src-tauri/.cargo/config.toml || true
          sed -i.bak '/CFLAGS.*\/MD/d' src-tauri/.cargo/config.toml || true
          sed -i.bak '/CXXFLAGS.*\/MD/d' src-tauri/.cargo/config.toml || true

      # ── JS/Frontend ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Clean CMake Cache
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: |
          Get-ChildItem -Path C:\bld -Recurse -Filter CMakeCache.txt -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem -Path C:\bld -Recurse -Filter CMakeFiles -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      # ── Build ──
      - name: Enable Long File Paths (Windows)
        if: contains(matrix.platform, 'windows')
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWord -Force
          git config --system core.longpaths true
          echo "CARGO_TARGET_DIR=C:\bld" >> $env:GITHUB_ENV

      - name: Setup MSVC Developer Command Prompt
        if: contains(matrix.platform, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'amd64_arm64' || 'x64' }}

      # Some Unix-oriented native dependencies emit `-lm` even for MSVC. Windows
      # has no separate libm, so provide an empty compatibility archive without
      # modifying the versioned Visual Studio installation on the runner.
      - name: Create m.lib compatibility archive (Windows)
        if: contains(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $compatDir = Join-Path $env:RUNNER_TEMP "taurscribe-msvc-compat\${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $compatDir | Out-Null
          Set-Content -Path (Join-Path $compatDir "empty.c") -Value "/* empty libm compatibility archive */"
          cl.exe /nologo /c (Join-Path $compatDir "empty.c") /Fo"$compatDir\empty.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $machine = if ('${{ matrix.target }}' -eq 'aarch64-pc-windows-msvc') { 'ARM64' } else { 'X64' }
          lib.exe /nologo /out:"$compatDir\m.lib" /machine:$machine "$compatDir\empty.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LIB=$compatDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Clean Build Artifacts
        if: contains(matrix.platform, 'windows')
        run: |
          if (Test-Path C:\bld) { Remove-Item -Recurse -Force C:\bld }
          if (Test-Path src-tauri/target/debug/build) { Remove-Item -Recurse -Force src-tauri/target/debug/build }

      - name: Disable ccache in CMake
        if: contains(matrix.platform, 'windows')
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=" >> $env:GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=" >> $env:GITHUB_ENV
          echo "CMAKE_DISABLE_FIND_PACKAGE_Ccache=TRUE" >> $env:GITHUB_ENV

      # llama-cpp-sys-2 build.rs hard-links .so files from its out/lib/ into
      # target/<triple>/release/ and deps/. On Linux with shared libs, cmake
      # installs versioned symlinks (libllama.so -> libllama.so.0). hard_link()
      # on a symlink creates a hard link to the symlink inode, producing a broken
      # symlink in the target dir (the relative target like "libllama.so.0" doesn't
      # exist there). When rust-cache restores these broken symlinks, the build.rs
      # check `if !dst.exists()` passes (broken symlinks return false), but
      # hard_link() panics with Os { code: 17, AlreadyExists } because the path
      # entry still exists. Fix: remove both the build dirs AND the stale .so
      # entries from the target profile directories.
      - name: Clean stale llama-cpp-sys-2 build cache (Linux)
        if: contains(matrix.platform, 'ubuntu')
        run: |
          find src-tauri/target -maxdepth 6 -type d -name 'llama-cpp-sys-2-*' \
            -path '*/release/build/*' -exec rm -rf {} + 2>/dev/null || true
          find src-tauri/target -maxdepth 5 -path '*/release/*' ! -path '*/build/*' \
            \( -name 'libllama*' -o -name 'libggml*' \) -delete 2>/dev/null || true

      - name: Remove stale library symlinks from the Rust cache
        if: ${{ !contains(matrix.platform, 'windows') }}
        shell: bash
        run: |
          # After a llama.cpp upgrade the cache can hold libggml*.0.dylib links whose
          # targets are gone; llama-cpp-sys-2 then fails with "File exists".
          find src-tauri/target -maxdepth 4 -type l ! -exec test -e {} \; -print -delete 2>/dev/null || true

      - name: Build Rust binary
        # On Windows, this is handled by build-windows.ts in the Bundle step
        if: matrix.os_name != 'Windows'
        run: |
          if [ "${{ contains(matrix.platform, 'ubuntu') }}" = "true" ]; then unset CCACHE_DISABLE; fi
          cd src-tauri
          cargo build --release --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CCACHE_DISABLE: "1"
          CMAKE_C_COMPILER_LAUNCHER: ${{ contains(matrix.platform, 'ubuntu') && 'ccache' || '' }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ contains(matrix.platform, 'ubuntu') && 'ccache' || '' }}
          CMAKE_DISABLE_FIND_PACKAGE_Ccache: ${{ contains(matrix.platform, 'ubuntu') && 'OFF' || 'TRUE' }}
          MSBUILDDISABLENODEREUSE: 1
          TRACKFILEACCESS: "false"
          RUST_BACKTRACE: 1
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ contains(matrix.platform, 'windows') && '1' || contains(matrix.platform, 'ubuntu') && env.CMAKE_BUILD_PARALLEL_LEVEL || '4' }}
          CMAKE_VERBOSE_MAKEFILE: "ON"
          GGML_CCACHE: ${{ contains(matrix.platform, 'windows') && 'OFF' || 'ON' }}
          CMAKE_GENERATOR: ${{ contains(matrix.platform, 'windows') && 'Ninja' || contains(matrix.platform, 'ubuntu') && 'Ninja' || 'Unix Makefiles' }}
          CMAKE_GENERATOR_PLATFORM: ${{ contains(matrix.platform, 'windows') && '' || '' }}
          WHISPER_NO_AVX: "0"
          WHISPER_NO_AVX2: "0"
          GGML_AVX: "ON"
          GGML_AVX2: "ON"
          # llama.cpp 0.1.157 (iqp.cpp) uses FMA intrinsics; every AVX2 CPU has FMA and F16C.
          GGML_FMA: "ON"
          GGML_F16C: "ON"
          CMAKE_CUDA_ARCHITECTURES: "61;75;86;89;120"
          MACOSX_DEPLOYMENT_TARGET: ${{ contains(matrix.platform, 'macos') && '14.0' || '' }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ contains(matrix.platform, 'macos') && '14.0' || '' }}
          CUDA_PATH: ${{ contains(matrix.platform, 'ubuntu') && env.CUDA_PATH || steps.cuda-toolkit.outputs.CUDA_PATH }}
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
          VK_ICD_FILENAMES: ${{ env.VK_ICD_FILENAMES }}
          VK_LAYER_PATH: ${{ env.VK_LAYER_PATH }}
          LD_LIBRARY_PATH: ${{ env.LD_LIBRARY_PATH }}
          RUSTFLAGS: ${{ contains(matrix.platform, 'ubuntu') && format('-L {0}/lib -L {1}/lib64/stubs -C link-arg=-fuse-ld=mold -C link-arg=-Wl,--allow-multiple-definition', env.VULKAN_SDK, env.CUDA_PATH) || (contains(matrix.platform, 'windows') && '-C link-arg=/FORCE:MULTIPLE -C link-arg=/ignore:4006' || '') }}
          # transcribe.cpp's CUDA objects must be -fPIC to link into the app (mold rejects them otherwise).
          TRANSCRIBE_CMAKE_ARGS: ${{ contains(matrix.platform, 'ubuntu') && '-DCMAKE_POSITION_INDEPENDENT_CODE=ON -DGGML_NATIVE=OFF' || contains(matrix.platform, 'windows') && '-DGGML_NATIVE=OFF' || '' }}
          # whisper.cpp and transcribe.cpp default to -march=native, which bakes the
          # build runner's CPU (often AVX-512) into the package and crashes users'
          # CPUs with SIGILL. OFF gives ggml's portable AVX2/FMA/F16C baseline.
          # whisper-rs only forwards WHISPER_*/CMAKE_* env vars; WHISPER_NATIVE maps
          # to GGML_NATIVE. Macs keep native tuning (arm64 runners are baseline M1).
          WHISPER_NATIVE: ${{ contains(matrix.platform, 'macos') && '' || 'OFF' }}
          # Match Bundle step env vars so cargo doesn't see a changed environment and recompile
          CI: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Build frontend
        run: bun run build

      # macOS: Build binary and run dylibbundler BEFORE tauri build. Tauri validates
      # bundle.macOS.frameworks paths during cargo build; the dylibs must exist.
      - name: Pre-bundle macOS dylibs (build binary + dylibbundler)
        if: contains(matrix.platform, 'macos')
        run: |
          cd src-tauri
          cargo build --release --target ${{ matrix.target }}
          cd ..
          TAURI_BUILD_TARGET=${{ matrix.target }} bun scripts/bundle-macos-dylibs.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CCACHE_DISABLE: "1"
          CMAKE_C_COMPILER_LAUNCHER: ""
          CMAKE_CXX_COMPILER_LAUNCHER: ""
          CMAKE_DISABLE_FIND_PACKAGE_Ccache: "TRUE"
          MSBUILDDISABLENODEREUSE: 1
          TRACKFILEACCESS: "false"
          RUST_BACKTRACE: 1
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          CMAKE_VERBOSE_MAKEFILE: "ON"
          GGML_CCACHE: "ON"
          CMAKE_GENERATOR: "Unix Makefiles"
          WHISPER_NO_AVX: "0"
          WHISPER_NO_AVX2: "0"
          GGML_AVX: "ON"
          GGML_AVX2: "ON"
          # llama.cpp 0.1.157 (iqp.cpp) uses FMA intrinsics; every AVX2 CPU has FMA and F16C.
          GGML_FMA: "ON"
          GGML_F16C: "ON"
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"

      - name: Copy binary to expected location
        run: |
          cd src-tauri
          mkdir -p target/release
          if [ -f "target/${{ matrix.target }}/release/taurscribe" ]; then
            cp "target/${{ matrix.target }}/release/taurscribe" "target/release/taurscribe"
            chmod +x "target/release/taurscribe"
          fi
          if [ -f "target/${{ matrix.target }}/release/taurscribe.exe" ]; then
            cp "target/${{ matrix.target }}/release/taurscribe.exe" "target/release/taurscribe.exe"
          fi
        shell: bash

      # ── Code signing (optional) ──
      # Each step only turns signing on when its secrets exist, so forks and
      # repos without certificates still produce (unsigned) builds.
      #
      # macOS secrets: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
      # APPLE_SIGNING_IDENTITY; for notarization also APPLE_ID, APPLE_PASSWORD
      # (app-specific password) and APPLE_TEAM_ID. `tauri build` reads them from
      # the environment, imports the certificate into a temporary keychain, signs
      # the .app and notarizes it.
      - name: Configure macOS signing and notarization
        if: matrix.os_name == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY secrets are not set: the macOS build will not be signed or notarized"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "macOS signing and notarization enabled"
          else
            echo "::warning::APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID are not all set: the macOS build will be signed but not notarized"
          fi

      # Windows secrets: WINDOWS_CERTIFICATE (base64 .pfx) and
      # WINDOWS_CERTIFICATE_PASSWORD. The certificate goes into the user store and
      # its thumbprint into a config overlay that the Bundle step passes to
      # `tauri build --config`, which then signs the exe and the NSIS installer.
      - name: Configure Windows code signing
        if: matrix.os_name == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "::warning::WINDOWS_CERTIFICATE secret is not set: the Windows build will not be signed"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "taurscribe-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String "$env:WINDOWS_CERTIFICATE_PASSWORD" -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          Remove-Item $pfx
          if (-not $cert) { throw "WINDOWS_CERTIFICATE has no certificate with a private key" }
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.windows-signing.json"
          Set-Content -Path $configPath -Value $config -Encoding utf8
          "WINDOWS_SIGNING_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Windows signing enabled (thumbprint $($cert.Thumbprint))"

      # ── Bundle ──
      - name: Bundle application
        run: |
          if [ "${{ contains(matrix.platform, 'ubuntu') }}" = "true" ]; then unset CCACHE_DISABLE; fi
          if [ "${{ matrix.os_name }}" = "Windows" ]; then
            # Use build-windows.ts which handles DLL bundling
            bun scripts/build-windows.ts --target ${{ matrix.target }} --bundles nsis \
              ${{ matrix.features && format('--features {0}', matrix.features) || '' }} \
              ${WINDOWS_SIGNING_CONFIG:+--config "$WINDOWS_SIGNING_CONFIG"}
          elif [ "${{ matrix.os_name }}" = "Linux" ]; then
            GPU_FLAVOR=${{ matrix.flavor }} bash scripts/bundle-linux-solibs.sh
            # rpm and appimage are dropped: packaging a ~1 GB payload (531 MB binary +
            # 490 MB libggml-cuda.so) via rpmbuild/mksquashfs takes 4+ hours and risks
            # hitting the 6-hour GHA timeout. .deb + .tar.gz cover all practical Linux
            # install scenarios. Re-add rpm/appimage if the binary size is reduced.
            # Each flavor's .deb pulls in the runtime its GPU stack needs.
            case "${{ matrix.flavor }}" in
              amd)    DEPENDS='["rocm-hip-runtime", "hipblas", "rocblas"]' ;;
              vulkan) DEPENDS='["libvulkan1"]' ;;
              *)      DEPENDS='[]' ;;
            esac
            bun run tauri build --target ${{ matrix.target }} --bundles deb \
              ${{ matrix.features && format('--features {0}', matrix.features) || '' }} \
              --config "{\"bundle\":{\"linux\":{\"deb\":{\"depends\":$DEPENDS}}}}"
          else
            # bundle_dmg.sh drives hdiutil, which intermittently fails on hosted
            # runners even with CI=true. The .app is already built by this point,
            # so a single retry costs seconds and clears the flake.
            bun run tauri build --target ${{ matrix.target }} || {
              echo "::warning::DMG bundling failed, retrying once (hdiutil flake)"
              sleep 15
              bun run tauri build --target ${{ matrix.target }}
            }
          fi
          # The smoke test's benchmark tool, built with the same flavor and env.
          FEAT="${{ matrix.features }}"
          (cd src-tauri && cargo build --release --target ${{ matrix.target }} --features "dev-tools${FEAT:+,$FEAT}" --bin engine_bench)
        shell: bash
        env:
          CI: "true"                    # Tauri expects CI=true (not CI=1) for non-interactive DMG on macOS
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CCACHE_DISABLE: "1"
          CMAKE_C_COMPILER_LAUNCHER: ${{ contains(matrix.platform, 'ubuntu') && 'ccache' || '' }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ contains(matrix.platform, 'ubuntu') && 'ccache' || '' }}
          CMAKE_DISABLE_FIND_PACKAGE_Ccache: ${{ contains(matrix.platform, 'ubuntu') && 'OFF' || 'TRUE' }}
          MSBUILDDISABLENODEREUSE: 1
          TRACKFILEACCESS: "false"
          RUST_BACKTRACE: 1
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ contains(matrix.platform, 'windows') && '1' || contains(matrix.platform, 'ubuntu') && env.CMAKE_BUILD_PARALLEL_LEVEL || '4' }}
          CMAKE_VERBOSE_MAKEFILE: "ON"
          GGML_CCACHE: ${{ contains(matrix.platform, 'windows') && 'OFF' || 'ON' }}
          CMAKE_GENERATOR: ${{ contains(matrix.platform, 'windows') && 'Ninja' || contains(matrix.platform, 'ubuntu') && 'Ninja' || 'Unix Makefiles' }}
          CMAKE_GENERATOR_PLATFORM: ${{ contains(matrix.platform, 'windows') && '' || '' }}
          WHISPER_NO_AVX: "0"
          WHISPER_NO_AVX2: "0"
          GGML_AVX: "ON"
          GGML_AVX2: "ON"
          # llama.cpp 0.1.157 (iqp.cpp) uses FMA intrinsics; every AVX2 CPU has FMA and F16C.
          GGML_FMA: "ON"
          GGML_F16C: "ON"
          CMAKE_CUDA_ARCHITECTURES: "61;75;86;89;120"
          MACOSX_DEPLOYMENT_TARGET: ${{ contains(matrix.platform, 'macos') && '14.0' || '' }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ contains(matrix.platform, 'macos') && '14.0' || '' }}
          CUDA_PATH: ${{ contains(matrix.platform, 'ubuntu') && env.CUDA_PATH || steps.cuda-toolkit.outputs.CUDA_PATH }}
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
          VK_ICD_FILENAMES: ${{ env.VK_ICD_FILENAMES }}
          VK_LAYER_PATH: ${{ env.VK_LAYER_PATH }}
          LD_LIBRARY_PATH: ${{ env.LD_LIBRARY_PATH }}
          RUSTFLAGS: ${{ contains(matrix.platform, 'ubuntu') && format('-L {0}/lib -L {1}/lib64/stubs -C link-arg=-fuse-ld=mold -C link-arg=-Wl,--allow-multiple-definition', env.VULKAN_SDK, env.CUDA_PATH) || (contains(matrix.platform, 'windows') && '-C link-arg=/FORCE:MULTIPLE -C link-arg=/ignore:4006' || '') }}
          # transcribe.cpp's CUDA objects must be -fPIC to link into the app (mold rejects them otherwise).
          TRANSCRIBE_CMAKE_ARGS: ${{ contains(matrix.platform, 'ubuntu') && '-DCMAKE_POSITION_INDEPENDENT_CODE=ON -DGGML_NATIVE=OFF' || contains(matrix.platform, 'windows') && '-DGGML_NATIVE=OFF' || '' }}
          # whisper.cpp and transcribe.cpp default to -march=native, which bakes the
          # build runner's CPU (often AVX-512) into the package and crashes users'
          # CPUs with SIGILL. OFF gives ggml's portable AVX2/FMA/F16C baseline.
          # whisper-rs only forwards WHISPER_*/CMAKE_* env vars; WHISPER_NATIVE maps
          # to GGML_NATIVE. Macs keep native tuning (arm64 runners are baseline M1).
          WHISPER_NATIVE: ${{ contains(matrix.platform, 'macos') && '' || 'OFF' }}
          APPIMAGE_EXTRACT_AND_RUN: "1"

      # Portable: zip the binary + DLLs from the already-built release directory.
      # Tauri 2.10+ dropped "installMode: portable" from the NSIS schema, so a
      # second full NSIS build is no longer a viable path for portable artifacts.
      - name: Create Windows portable zip
        if: matrix.os_name == 'Windows'
        shell: pwsh
        run: |
          $targetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { "src-tauri/target" }
          $releaseDir = "$targetDir\${{ matrix.target }}\release"
          New-Item -ItemType Directory -Force -Path "dist-windows-portable" | Out-Null
          $files = [System.Collections.Generic.List[string]]::new()
          if (Test-Path "$releaseDir\taurscribe.exe") { $files.Add("$releaseDir\taurscribe.exe") }
          Get-ChildItem "$releaseDir\*.dll" -ErrorAction SilentlyContinue | ForEach-Object { $files.Add($_.FullName) }
          if ($files.Count -eq 0) {
            Write-Warning "No files found for portable zip"
          } else {
            Compress-Archive -Path $files -DestinationPath "dist-windows-portable\taurscribe-portable.zip" -Force
            Write-Host "Created portable zip with $($files.Count) file(s)"
          }

      - name: Verify Windows installer and portable DLLs
        if: matrix.os_name == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-artifacts.ps1 -TargetTriple '${{ matrix.target }}' -Flavor '${{ matrix.flavor }}'

      # ── Rename artifacts for clean release names ──
      - name: Prepare release artifacts
        shell: bash
        run: |
          # Branch runs (gpu-smoke/foo) have a slash in the ref name.
          TAG="${{ github.ref_name }}"
          TAG="${TAG//\//-}"
          # GPU builds carry their flavor in the file name; standard builds don't.
          case "${{ matrix.flavor }}" in
            cpu|apple) SUFFIX="" ;;
            *) SUFFIX="-${{ matrix.flavor }}" ;;
          esac
          mkdir -p release-assets

          # Windows: NSIS installer + portable zip
          if [ "${{ matrix.os_name }}" = "Windows" ]; then
            ARCH=$([ "${{ matrix.arch }}" = "ARM64" ] && echo "arm64" || echo "x64")
            # NSIS installer from bundle/nsis
            for dir in "C:/bld" "src-tauri/target"; do
              for f in "$dir/${{ matrix.target }}/release/bundle/nsis/"*.exe; do
                if [ -f "$f" ]; then
                  cp "$f" "release-assets/taurscribe-${TAG}-windows-${ARCH}${SUFFIX}-setup.exe"
                  break 2
                fi
              done
            done
            # Portable zip (exe + DLLs, no installer required)
            for f in dist-windows-portable/*.zip; do
              if [ -f "$f" ]; then
                cp "$f" "release-assets/taurscribe-${TAG}-windows-${ARCH}${SUFFIX}-portable.zip"
                break
              fi
            done
          fi

          # macOS DMG (Apple Silicon & Intel x86_64)
          if [ "${{ matrix.os_name }}" = "macOS" ]; then
            ARCH_NAME=$([ "${{ matrix.arch }}" = "ARM64" ] && echo "arm64" || echo "x64")
            for f in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
              if [ -f "$f" ]; then
                cp "$f" "release-assets/taurscribe-${TAG}-macos-${ARCH_NAME}.dmg"
                if [ "${ARCH_NAME}" = "x64" ]; then
                  cp "$f" "release-assets/Taurscribe_x64.dmg"
                else
                  cp "$f" "release-assets/Taurscribe_aarch64.dmg"
                fi
              fi
            done
          fi

          # Linux: DEB + portable tarball (extracted from .deb)
          # rpm and appimage dropped — see bundle step comment above.
          if [ "${{ matrix.os_name }}" = "Linux" ]; then
            DEB=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb 2>/dev/null | head -1)
            if [ -n "$DEB" ] && [ -f "$DEB" ]; then
              cp "$DEB" "release-assets/taurscribe-${TAG}-linux-amd64${SUFFIX}.deb"
              rm -rf /tmp/taurscribe-deb-root
              mkdir -p /tmp/taurscribe-deb-root
              dpkg-deb -x "$DEB" /tmp/taurscribe-deb-root
              tar -czf "release-assets/taurscribe-${TAG}-linux-x64${SUFFIX}.tar.gz" -C /tmp/taurscribe-deb-root .
            fi
          fi

          echo "=== Release assets ==="
          ls -la release-assets/

      # vulkan-1.dll comes with every AMD / Intel / NVIDIA driver, but the hosted
      # runner has no GPU driver. Install just the loader (LunarG VulkanRT) so the
      # smoke test starts the app like on a real PC; with no device it must fall
      # back to the CPU.
      - name: Install Vulkan runtime for the smoke test (Windows)
        if: matrix.os_name == 'Windows' && matrix.flavor == 'vulkan'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'VulkanRT.exe'
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/1.4.309.0/windows/VulkanRT-1.4.309.0-Installer.exe?Human=true' -OutFile $out -UseBasicParsing
          Start-Process $out -ArgumentList '/S' -Wait
          if (-not (Test-Path "$env:SystemRoot\System32\vulkan-1.dll")) { throw 'vulkan-1.dll was not installed' }

      # ── Smoke test on a GPU-less runner ──
      # Proves the packaged app starts, the CLI answers, the GPU detector runs,
      # and speech transcribes (on the CPU fallback here). NVIDIA / AMD / Adreno
      # builds may need their driver just to start, so for them a failure is a
      # warning that tells us exactly that.
      # Windows ARM64 is cross-compiled on an x64 runner, so its smoke test runs
      # in the smoke-arm64 job below on a real ARM64 machine.
      - name: Smoke test (no GPU)
        if: matrix.target != 'aarch64-pc-windows-msvc'
        continue-on-error: ${{ contains(fromJSON('["nvidia", "amd", "adreno"]'), matrix.flavor) }}
        shell: bash
        run: |
          set -euo pipefail
          T="${{ matrix.target }}"
          TD="${CARGO_TARGET_DIR:-src-tauri/target}"
          TD="${TD//\\//}"
          case "${{ matrix.os_name }}" in
            Windows)
              rm -rf smoke && mkdir smoke
              unzip -q dist-windows-portable/taurscribe-portable.zip -d smoke
              APP=smoke/taurscribe.exe
              BENCH="$TD/$T/release/engine_bench.exe" ;;
            Linux)
              APP=$(find /tmp/taurscribe-deb-root/usr/bin -type f | head -1)
              LIBDIR=$(dirname "$(find /tmp/taurscribe-deb-root -name 'libllama.so*' | head -1)")
              export LD_LIBRARY_PATH="$LIBDIR${ROCM_PATH:+:$ROCM_PATH/lib}"
              BENCH="$TD/$T/release/engine_bench" ;;
            macOS)
              APP=$(find "$TD/$T/release/bundle/macos" -path '*Contents/MacOS/*' -type f -perm -u+x | head -1)
              BENCH="$TD/$T/release/engine_bench" ;;
          esac
          echo "app: $APP"
          "$APP" --version
          "$APP" status --json
          "$BENCH" gpu | tee gpu-report.json

          MODELS=$("$BENCH" models-dir | tr -d '\r')
          if command -v cygpath >/dev/null; then MODELS=$(cygpath -u "$MODELS"); fi
          curl -sSfL -o "$MODELS/ggml-tiny-q5_1.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin
          JFK=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path '*whisper.cpp/samples/jfk.wav' | head -1)
          "$BENCH" whisper tiny-q5_1 "$JFK" --runs 1 | tee whisper.txt
          grep -qi "ask not what your country" whisper.txt

          {
            echo "### ${{ matrix.name }} · flavor \`${{ matrix.flavor }}\`"
            echo '```'
            "$APP" --version
            grep '^\[bench\]' whisper.txt
            echo '```'
            echo '<details><summary>GPU report</summary>'
            echo
            echo '```json'
            cat gpu-report.json
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Upload artifacts (so the release job can download them) ──
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os_name }}-${{ matrix.arch }}-${{ matrix.flavor }}
          path: release-assets/*
          if-no-files-found: warn

      - name: Stage ARM64 build for its smoke test
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          mkdir -p smoke-out
          cp dist-windows-portable/taurscribe-portable.zip smoke-out/
          cp "${CARGO_TARGET_DIR//\\//}/${{ matrix.target }}/release/engine_bench.exe" smoke-out/

      - name: Upload ARM64 build for its smoke test
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows-arm64-${{ matrix.flavor }}
          path: smoke-out/*
          if-no-files-found: error
          retention-days: 3

  # ── Smoke test the Windows ARM64 builds on ARM64 hardware ─────────────────
  smoke-arm64:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        flavor: [cpu, adreno]
    # The Adreno build needs the Qualcomm OpenCL driver, which this runner lacks.
    continue-on-error: ${{ matrix.flavor == 'adreno' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smoke-windows-arm64-${{ matrix.flavor }}
          path: smoke-in

      - name: Smoke test (no GPU)
        shell: bash
        run: |
          set -euo pipefail
          mkdir smoke
          unzip -q "$(find smoke-in -name taurscribe-portable.zip)" -d smoke
          cp "$(find smoke-in -name engine_bench.exe)" smoke/
          APP=smoke/taurscribe.exe
          BENCH=smoke/engine_bench.exe
          "$APP" --version
          "$APP" status --json
          "$BENCH" gpu | tee gpu-report.json

          MODELS=$("$BENCH" models-dir | tr -d '\r')
          MODELS=$(cygpath -u "$MODELS")
          mkdir -p "$MODELS"
          curl -sSfL -o "$MODELS/ggml-tiny-q5_1.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin
          curl -sSfL -o jfk.wav https://github.com/ggml-org/whisper.cpp/raw/master/samples/jfk.wav
          "$BENCH" whisper tiny-q5_1 jfk.wav --runs 1 | tee whisper.txt
          grep -qi "ask not what your country" whisper.txt

          {
            echo "### Windows (ARM64) · flavor \`${{ matrix.flavor }}\`"
            echo '```'
            "$APP" --version
            grep '^\[bench\]' whisper.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Create GitHub Release ─────────────────────────────────────────────────
  release:
    needs: build
    # Branch and manual runs are smoke tests; only version tags publish.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          pattern: release-*
          merge-multiple: true

      - name: List all assets
        run: |
          echo "=== All release assets ==="
          ls -la all-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Taurscribe ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: all-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
