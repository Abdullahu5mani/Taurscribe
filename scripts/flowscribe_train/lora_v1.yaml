# FlowScribe v3 pilot: LoRA on Qwen3.5-0.8B (bf16 base; fused result stays full precision).
model: "/Volumes/ExternalSSD/TaurscribeData/hf/hub/models--Qwen--Qwen3.5-0.8B/snapshots/2fc06364715b967f1860aea9cf38778875588b17"
train: true
fine_tune_type: lora
data: data/v1
mask_prompt: true          # learn only the assistant answer
seed: 0
num_layers: -1             # adapt every layer
batch_size: 4
grad_accumulation_steps: 4  # effective batch 16 within 16 GB unified memory
iters: 5332                # micro-steps: ~2 epochs of 10,662 records at batch 4
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1.0e-6
  arguments: [1.0e-4, 1333, 5.0e-6]  # schedule counts optimizer updates (iters / 4)
lora_parameters:
  rank: 32
  scale: 10.0
  dropout: 0.05
max_seq_length: 512
grad_checkpoint: true
optimizer: adamw
steps_per_report: 40
steps_per_eval: 800
val_batches: 40
save_every: 400
adapter_path: adapters/v1
